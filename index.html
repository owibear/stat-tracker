let syncBusy = false, syncTimer = null, syncMsg = "";
const sbReady = () => !!(S.settings.sbUrl && S.settings.sbAnon && S.settings.sbToken);
function jwtSub(tok){
  try { return JSON.parse(atob(tok.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))).sub; }
  catch(e){ return null; }
}
async function sbCall(path, opts = {}, auth = true){
  const url = S.settings.sbUrl.replace(/\/$/,"") + path;
  const headers = Object.assign({ "apikey": S.settings.sbAnon, "Content-Type":"application/json" }, opts.headers||{});
  if (auth && S.settings.sbToken) headers["Authorization"] = "Bearer " + S.settings.sbToken;
  const res = await fetch(url, { ...opts, headers });
  if (res.status === 401 && auth && S.settings.sbRefresh){
    const ok = await sbRefresh();
    if (ok) return sbCall(path, opts, auth);
  }
  return res;
}
async function sbRefresh(){
  const res = await fetch(S.settings.sbUrl.replace(/\/$/,"") + "/auth/v1/token?grant_type=refresh_token", {
    method:"POST", headers:{ "apikey":S.settings.sbAnon, "Content-Type":"application/json" },
    body: JSON.stringify({ refresh_token: S.settings.sbRefresh })
  });
  if (!res.ok) return false;
  const d = await res.json();
  S.settings.sbToken = d.access_token; S.settings.sbRefresh = d.refresh_token;
  Store.save(S); return true;
}
async function sbAuth(mode, email, password){
  const path = mode === "signup" ? "/auth/v1/signup" : "/auth/v1/token?grant_type=password";
  const res = await fetch(S.settings.sbUrl.replace(/\/$/,"") + path, {
    method:"POST", headers:{ "apikey":S.settings.sbAnon, "Content-Type":"application/json" },
    body: JSON.stringify({ email, password })
  });
  const d = await res.json().catch(()=>({}));
  if (!res.ok) return { ok:false, msg: d.msg || d.error_description || d.message || "Sign-in failed" };
  if (!d.access_token) return { ok:false, msg:"Check your email to confirm the account, then sign in." };
  S.settings.sbToken = d.access_token; S.settings.sbRefresh = d.refresh_token; S.settings.sbEmail = email;
  Store.save(S);
  return { ok:true };
}

function mergeStates(local, remote){
  const tombs = [...(local.tombstones||[]), ...(remote.tombstones||[])];
  const dead = new Set(tombs.map(t=>t.kind + ":" + t.id));
  const pickNewer = remote.updatedAt > local.updatedAt ? remote : local;
  const older = pickNewer === remote ? local : remote;
  const mergeById = (key, kind) => {
    const map = new Map();
    (older[key]||[]).forEach(x => map.set(x.id, x));
    (pickNewer[key]||[]).forEach(x => map.set(x.id, x));
    return [...map.values()].filter(x => !dead.has(kind + ":" + x.id));
  };
  const trackers = mergeById("trackers","tracker");
  const liveIds = new Set(trackers.map(t=>t.id));
  return {
    trackers,
    entries: mergeById("entries","entry").filter(e => liveIds.has(e.trackerId)),
    chat: (pickNewer.chat||[]).length >= (older.chat||[]).length ? (pickNewer.chat||[]) : (older.chat||[]),
    unlocked: [...new Set([...(local.unlocked||[]), ...(remote.unlocked||[])])],
    tombstones: tombs.slice(-800),
    updatedAt: Math.max(local.updatedAt||0, remote.updatedAt||0),
    settings: local.settings
  };
}

function queueSync(){
  if (!sbReady()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>syncNow(true), 4000);
}

async function syncNow(quiet){
  if (!sbReady()){ if (!quiet) toast("Add your Supabase details in Settings first"); return; }
  if (syncBusy) return;
  syncBusy = true; syncMsg = "Syncing…"; refreshSyncBadge();
  try {
    const uid = jwtSub(S.settings.sbToken);
    const get = await sbCall(`/rest/v1/baseline_state?select=data,updated_at&user_id=eq.${uid}`, { method:"GET" });
    if (!get.ok) throw new Error("read failed (" + get.status + ")");
    const rows = await get.json();
    let merged = S;
    if (rows.length && rows[0].data){
      const remote = rows[0].data;
      const before = JSON.stringify({t:S.trackers.length, e:S.entries.length});
      merged = mergeStates(S, remote);
      S.trackers = merged.trackers; S.entries = merged.entries;
      S.chat = merged.chat; S.unlocked = merged.unlocked; S.tombstones = merged.tombstones;
      S.updatedAt = merged.updatedAt;
      const after = JSON.stringify({t:S.trackers.length, e:S.entries.length});
      if (before !== after) renderAll();
    }
    const body = { user_id: uid, data: { trackers:S.trackers, entries:S.entries, chat:S.chat, unlocked:S.unlocked, tombstones:S.tombstones, updatedAt:S.updatedAt }, updated_at: new Date().toISOString() };
    const put = await sbCall("/rest/v1/baseline_state?on_conflict=user_id", {
      method:"POST", headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" }, body: JSON.stringify(body)
    });
    if (!put.ok) throw new Error("write failed (" + put.status + ")");
    S.settings.lastSync = Date.now(); Store.save(S);
    syncMsg = ""; if (!quiet) toast("Synced");
  } catch(err){
    syncMsg = err.message || "Sync failed";
    if (!quiet) toast("Sync failed — " + syncMsg);
  }
  syncBusy = false; refreshSyncBadge();
  if ($("#scrim").classList.contains("is-open") && $("#set-sync")) renderSyncBlock();
}
function refreshSyncBadge(){
  const b = $("#btn-sync");
  if (!b) return;
  b.textContent = syncBusy ? "Syncing…" : "Sync";
  b.style.opacity = sbReady() ? 1 : .45;
}

/* ===== 19. NOTIFICATIONS ===== */
async function askNotify(){
  if (!("Notification" in window)) return false;
  const perm = await Notification.requestPermission();
  return perm === "granted";
}
function notifyCheck(){
  const st = S.settings;
  if (!st.notifyOn || !("Notification" in window) || Notification.permission !== "granted") return;
  const now = new Date();
  const [h,m] = (st.notifyTime||"20:00").split(":").map(Number);
  if (now.getHours()*60 + now.getMinutes() < h*60 + m) return;
  if (st.lastNotify === today()) return;
  st.lastNotify = today(); Store.save(S);
  const d = weeklyDigest();
  const first = d.lines.find(l=>l.cls === "act");
  const body = first ? first.html.replace(/<[^>]+>/g,"") : `Seven-day pace is ${Math.round(d.now*100)}%.`;
  try { new Notification("Baseline — today's check", { body, icon:"icon-192.png", badge:"icon-192.png", tag:"baseline-daily" }); } catch(e){}
}

/* ===== 20. SETTINGS SHEET ===== */
function openSettings(){
  const st = S.settings;
  const themes = [["light","Light","#EDEFEE"],["dark","Dark","#101416"],["halloween","Halloween","#E4761B"],["auto","Match system","linear-gradient(90deg,#EDEFEE 50%,#101416 50%)"]];
  $("#sheet").innerHTML = `
    <h3>Settings</h3>
    <div class="set-group">
      <h4>Appearance</h4><p>Charts and badges recolour to match.</p>
      <div class="theme-chips" id="set-theme">
        ${themes.map(([k,l,c])=>`<button data-act="settheme" data-v="${k}" aria-pressed="${st.theme===k}"><i style="background:${c}"></i>${l}</button>`).join("")}
      </div>
    </div>
    <div class="set-group">
      <h4>Daily check-in</h4><p>A local reminder with the one thing most behind. On iPhone this needs Baseline added to your Home Screen.</p>
      <div class="toggle-row">
        <span>Remind me daily<small>${("Notification" in window) ? (Notification.permission === "denied" ? "Blocked in your browser settings" : "Fires while Baseline is open or in the background") : "Not supported in this browser"}</small></span>
        <button class="sw" data-act="notify-toggle" aria-pressed="${!!st.notifyOn}" aria-label="Daily reminder"></button>
      </div>
      <div class="field"><label for="set-time">Reminder time</label><input id="set-time" type="time" value="${st.notifyTime||"20:00"}"></div>
    </div>
    <div class="set-group" id="set-sync"></div>
    <div class="set-group">
      <h4>AI chat in Updates</h4>
      <p>Optional. Paste an Anthropic API key and the Updates tab gains a chat that can see your data. Everything else works without it — the pace maths is all local.</p>
      <div class="field"><label for="set-key">Anthropic API key</label><input id="set-key" type="password" placeholder="sk-ant-…" value="${esc(st.apiKey||"")}"></div>
      <div class="hint">Stored only on this device. Leave blank to keep Updates rules-only.</div>
    </div>
    <div class="set-group">
      <h4>Your data</h4><p>A JSON file with every tracker, entry and badge.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="mini secondary" data-act="do-export">Export file</button>
        <button class="mini secondary" data-act="do-import">Import file</button>
        <button class="mini danger" data-act="do-reset">Erase everything</button>
      </div>
    </div>
    <div class="sheet-actions"><div></div><div><button class="mini" data-act="set-save">Done</button></div></div>`;
  renderSyncBlock();
  $("#scrim").classList.add("is-open");
}

function renderSyncBlock(){
  const host = $("#set-sync"); if (!host) return;
  const st = S.settings;
  const signedIn = !!st.sbToken;
  const when = st.lastSync ? new Date(st.lastSync).toLocaleString() : "never";
  const dotCol = syncBusy ? "var(--warn)" : (signedIn && !syncMsg) ? "var(--signal)" : syncMsg ? "var(--behind)" : "var(--line-strong)";
  host.innerHTML = `
    <h4>Sync across devices</h4>
    <p>Your own free Supabase project holds one row of JSON. Local data stays the source of truth, so the app works offline and catches up later.</p>
    <div class="field"><label for="sb-url">Project URL</label><input id="sb-url" placeholder="https://xxxx.supabase.co" value="${esc(st.sbUrl||"")}"></div>
    <div class="field"><label for="sb-anon">Anon public key</label><input id="sb-anon" type="password" placeholder="eyJ…" value="${esc(st.sbAnon||"")}"></div>
    ${signedIn ? `
      <div class="sync-state"><span class="dot" style="background:${dotCol}"></span>Signed in as <b>${esc(st.sbEmail||"")}</b><br>Last sync: ${when}${syncMsg?`<br>${esc(syncMsg)}`:""}</div>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
        <button class="mini" data-act="sync-now">Sync now</button>
        <button class="mini secondary" data-act="sign-out">Sign out</button>
      </div>`
    : `
      <div class="field-pair">
        <div class="field"><label for="sb-email">Email</label><input id="sb-email" type="email" value="${esc(st.sbEmail||"")}"></div>
        <div class="field"><label for="sb-pass">Password</label><input id="sb-pass" type="password" placeholder="8+ characters"></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="mini" data-act="sign-in">Sign in</button>
        <button class="mini secondary" data-act="sign-up">Create account</button>
      </div>
      ${syncMsg?`<div class="sync-state" style="color:var(--behind)">${esc(syncMsg)}</div>`:""}`}`;
}

function saveSyncFields(){
  const u = $("#sb-url"), a = $("#sb-anon");
  if (u) S.settings.sbUrl = u.value.trim();
  if (a) S.settings.sbAnon = a.value.trim();
}

/* ===== 14. EVENTS ===== */
function toast(msg){
  const el = $("#toast"); el.textContent = msg; el.classList.add("is-shown");
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove("is-shown"), 1900);
}
const readNum = sel => { const el = document.querySelector(sel); const v = parseFloat(el?.value); return { el, v }; };

document.addEventListener("click", e=>{
  const tpl = e.target.closest("[data-tpl]");
  if (tpl){
    const rec = Object.assign({ id:uid(), createdAt:today(), unit:"", target:null, targetPeriod:"day", goalAmount:null, deadline:null, parentId:null }, TEMPLATES[tpl.dataset.tpl]);
    S.trackers.push(rec); persist(); renderAll(); toast(`${rec.name} added`); return;
  }
  const cell = e.target.closest("[data-day]");
  if (cell){ calSelected = cell.dataset.day; renderDays(); $("#day-detail")?.scrollIntoView({behavior:"smooth", block:"nearest"}); return; }

  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id, t = id ? byId(id) : null;

  if (act === "uk-next"){ advanceUnlock(); return; }
  if (act === "open-settings"){ openSettings(); return; }
  if (act === "settheme"){ applyTheme(b.dataset.v); openSettings(); return; }
  if (act === "notify-toggle"){
    (async ()=>{
      if (!S.settings.notifyOn){
        const ok = await askNotify();
        if (!ok){ toast("Notifications are blocked in your browser settings"); return; }
        S.settings.notifyOn = true;
      } else S.settings.notifyOn = false;
      Store.save(S); openSettings();
    })();
    return;
  }
  if (act === "do-export"){ doExport(); return; }
  if (act === "do-import"){ $("#file-input").click(); return; }
  if (act === "do-reset"){
    if (!confirm("Erase every tracker, entry and badge on this device? This cannot be undone.")) return;
    S.trackers = []; S.entries = []; S.chat = []; S.unlocked = []; S.tombstones = [];
    persist(); closeSheet(); renderAll(); toast("Everything erased");
    return;
  }
  if (act === "sign-in" || act === "sign-up"){
    saveSyncFields();
    const email = $("#sb-email")?.value.trim(), pass = $("#sb-pass")?.value;
    if (!S.settings.sbUrl || !S.settings.sbAnon){ syncMsg = "Add your project URL and anon key first."; renderSyncBlock(); return; }
    if (!email || !pass){ syncMsg = "Email and password required."; renderSyncBlock(); return; }
    syncMsg = "Working…"; renderSyncBlock();
    sbAuth(act === "sign-up" ? "signup" : "signin", email, pass).then(r=>{
      syncMsg = r.ok ? "" : r.msg;
      renderSyncBlock(); refreshSyncBadge();
      if (r.ok) syncNow();
    });
    return;
  }
  if (act === "sign-out"){
    S.settings.sbToken = ""; S.settings.sbRefresh = ""; syncMsg = "";
    Store.save(S); renderSyncBlock(); refreshSyncBadge(); return;
  }
  if (act === "sync-now"){ saveSyncFields(); Store.save(S); syncNow(); return; }
  if (act === "set-save"){
    saveSyncFields();
    const t = $("#set-time"), k = $("#set-key");
    if (t) S.settings.notifyTime = t.value || "20:00";
    if (k) S.settings.apiKey = k.value.trim();
    Store.save(S); closeSheet(); renderAll(); toast("Settings saved");
    return;
  }
  if (act === "bfilter"){ badgeFilter = b.dataset.f; renderBadges(); return; }
  if (act === "month"){ calMonth = shiftMonth(calMonth, +b.dataset.n); calSelected = null; renderDays(); return; }
  if (act === "toggle"){
    aggValueOn(id, today()) > 0 ? removeEntry(id, today()) : setEntry(id, today(), 1);
    renderTrack(); return;
  }
  if (act === "val-save"){
    const { el, v } = readNum(`[data-role="val"][data-id="${id}"]`);
    isNaN(v) ? removeEntry(id, today()) : setEntry(id, today(), v);
    renderTrack(); toast(isNaN(v) ? "Entry cleared" : "Logged"); return;
  }
  if (act === "sleep-save" || act === "dsleep"){
    const pre = act === "dsleep" ? "d" : "";
    const date = act === "dsleep" ? calSelected : today();
    const bed = document.querySelector(`[data-role="${pre}bed"][data-id="${id}"]`).value;
    const wake = document.querySelector(`[data-role="${pre}wake"][data-id="${id}"]`).value;
    if (!bed || !wake){ toast("Need both times"); return; }
    const [bh,bm] = bed.split(":").map(Number), [wh,wm] = wake.split(":").map(Number);
    let mins = (wh*60+wm)-(bh*60+bm); if (mins <= 0) mins += 1440;
    setEntry(id, date, +(mins/60).toFixed(2), { bed, wake });
    act === "dsleep" ? renderDays() : renderTrack();
    toast(`${(mins/60).toFixed(1)}h logged`); return;
  }
  if (act === "save-add" || act === "ledger-in" || act === "ledger-out"){
    const { el, v } = readNum(`[data-role="amt"][data-id="${id}"]`);
    if (isNaN(v) || v === 0){ toast("Enter an amount"); return; }
    if (act === "save-add"){
      setEntry(id, today(), (ownEntryOn(id,today())?.value || 0) + v);
      toast(`${money(v)} added`);
    } else {
      addLedgerEntry(id, act === "ledger-in" ? "in" : "out", v);
      toast(act === "ledger-in" ? "Income logged" : "Expense logged");
    }
    el.value = ""; renderTrack(); return;
  }
  if (act === "addsub"){ openSheet(null, id); return; }
  if (act === "edit"){ openSheet(t); return; }
  if (act === "chart"){ t.chart = b.dataset.kind; persist(); renderProgress(); return; }

  /* day-detail editing */
  if (act === "dtoggle"){
    const e2 = ownEntryOn(id, calSelected);
    e2 && e2.value > 0 ? removeEntry(id, calSelected) : setEntry(id, calSelected, 1);
    renderDays(); return;
  }
  if (act === "dval"){
    const { v } = readNum(`[data-role="dval"][data-id="${id}"]`);
    isNaN(v) ? removeEntry(id, calSelected) : setEntry(id, calSelected, v);
    renderDays(); toast("Saved"); return;
  }
  if (act === "dclear"){ removeEntry(id, calSelected); renderDays(); toast("Entry cleared"); return; }
  if (act === "dled-in" || act === "dled-out"){
    const { el, v } = readNum(`[data-role="damt"][data-id="${id}"]`);
    if (isNaN(v) || v === 0){ toast("Enter an amount"); return; }
    addLedgerEntry(id, act === "dled-in" ? "in" : "out", v, calSelected);
    renderDays(); toast("Logged"); return;
  }
  if (act === "del-entry"){ removeEntryById(b.dataset.eid); renderDays(); toast("Entry deleted"); return; }
  if (act === "hist-del"){
    removeEntryById(b.dataset.eid);
    const tr = byId(b.dataset.tid); renderHistory(tr); renderTrack(); toast("Entry deleted"); return;
  }
});

document.addEventListener("change", e=>{
  const h = e.target.closest('[data-role="hval"]');
  if (h){
    const ent = S.entries.find(x=>x.id===h.dataset.eid);
    const v = parseFloat(h.value);
    if (ent && !isNaN(v)){ ent.value = v; persist(); renderTrack(); toast("Entry updated"); }
  }
});

$("#scrim").addEventListener("click", e=>{ if (e.target.id === "scrim") closeSheet(); });
document.addEventListener("keydown", e=>{
  if (e.key === "Escape") closeSheet();
  if ((e.key === "Enter" || e.key === " ") && e.target.dataset?.day){ e.preventDefault(); e.target.click(); }
});
$("#btn-new").addEventListener("click", ()=>openSheet(null));
$("#btn-settings").addEventListener("click", openSettings);
$("#btn-sync").addEventListener("click", ()=>syncNow());
$("#unlock").addEventListener("click", e=>{ if (e.target.id === "unlock") advanceUnlock(); });

/* theme */
function resolveTheme(name){
  if (name !== "auto") return name;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function applyTheme(name){
  S.settings.theme = name;
  document.documentElement.setAttribute("data-theme", resolveTheme(name));
  const bg = { light:"#EDEFEE", dark:"#101416", halloween:"#141010" }[resolveTheme(name)];
  document.getElementById("meta-theme")?.setAttribute("content", bg);
  persist();
  renderAll();
}
window.matchMedia?.("(prefers-color-scheme: dark)").addEventListener?.("change", ()=>{
  if (S.settings.theme === "auto") applyTheme("auto");
});

/* tabs */
const TABS = ["track","days","badges","progress","insights"];
let activeTab = "track";
function setTab(name){
  activeTab = name;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===name));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("is-active", p.dataset.panel===name));
  moveUnderline();
  if (name === "days") renderDays();
  if (name === "badges") renderBadges();
  if (name === "progress") renderProgress();
  if (name === "insights") renderInsights();
  $("#btn-new").style.display = name === "track" ? "" : "none";
}
function moveUnderline(){
  const btn = document.querySelector(`.tab[data-tab="${activeTab}"]`);
  const u = $("#underline");
  u.style.width = btn.offsetWidth + "px";
  u.style.transform = `translateX(${btn.offsetLeft}px)`;
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click", ()=>setTab(b.dataset.tab)));
window.addEventListener("resize", moveUnderline);

/* swipe */
let sx = 0, sy = 0;
const area = $("#swipe-area");
area.addEventListener("touchstart", e=>{ sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
area.addEventListener("touchend", e=>{
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) < 55 || Math.abs(dy) > Math.abs(dx)) return;
  const i = TABS.indexOf(activeTab) + (dx < 0 ? 1 : -1);
  if (i >= 0 && i < TABS.length) setTab(TABS[i]);
}, {passive:true});

/* export / import */
function doExport(){
  const blob = new Blob([JSON.stringify(S,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `baseline-${today()}.json`; a.click();
  URL.revokeObjectURL(a.href); toast("Data exported");
}
$("#file-input").addEventListener("change", e=>{
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try {
      const d = JSON.parse(r.result);
      if (!d.trackers) throw new Error("bad");
      S = { trackers:d.trackers||[], entries:d.entries||[], chat:d.chat||[], unlocked:d.unlocked||null, tombstones:d.tombstones||[], updatedAt:d.updatedAt||Date.now(), settings:{...DEFAULT_SETTINGS, ...(d.settings||{})} };
      persist(); applyTheme(S.settings.theme||"light"); toast("Data imported");
    } catch(err){ toast("That file isn't a Baseline export"); }
  };
  r.readAsText(f); e.target.value = "";
});

/* ===== 15. BOOT ===== */
function renderAll(){
  renderTrack();
  syncAchievements();
  if (activeTab === "days") renderDays();
  if (activeTab === "badges") renderBadges();
  if (activeTab === "progress") renderProgress();
  if (activeTab === "insights") renderInsights();
}
(async function boot(){
  $("#datestamp").textContent = prettyDate(today());
  await Store.init();
  const saved = await Store.load();
  if (saved && saved.trackers){
    S = { trackers:saved.trackers, entries:saved.entries||[], chat:saved.chat||[], unlocked:saved.unlocked||null, tombstones:saved.tombstones||[], updatedAt:saved.updatedAt||0, settings:{...DEFAULT_SETTINGS, ...(saved.settings||{})} };
    S.trackers.forEach(t=>{ if (t.parentId === undefined) t.parentId = null; });
  } else {
    S.trackers = [Object.assign({ id:uid(), createdAt:today(), unit:"", goalAmount:null, deadline:null, parentId:null }, TEMPLATES.gym)];
    persist();
  }
  document.documentElement.setAttribute("data-theme", resolveTheme(S.settings.theme || "light"));
  const th = resolveTheme(S.settings.theme || "light");
  document.documentElement.setAttribute("data-theme", th);
  document.getElementById("meta-theme")?.setAttribute("content", {light:"#EDEFEE",dark:"#101416",halloween:"#141010"}[th]);
  renderAll();
  moveUnderline();
  refreshSyncBadge();

  if ("serviceWorker" in navigator && location.protocol.startsWith("http"))
    navigator.serviceWorker.register("sw.js").catch(()=>{});

  if (sbReady()) syncNow(true);
  window.addEventListener("online", ()=>{ if (sbReady()) syncNow(true); });
  document.addEventListener("visibilitychange", ()=>{
    if (document.visibilityState === "visible"){ notifyCheck(); if (sbReady()) syncNow(true); }
  });
  notifyCheck();
  setInterval(notifyCheck, 60000);
})();
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baseline</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EDEFEE" id="meta-theme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Baseline">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root, [data-theme="light"]{
  --paper:#EDEFEE; --surface:#FFFFFF; --ink:#141A1C; --muted:#6D767C;
  --line:#DBE0DE; --line-strong:#C3CAC7;
  --signal:#15624B; --warn:#A65C1C; --behind:#8E2F2F;
  --signal-soft:#E4EEEA; --warn-soft:#F6EBDF;
  --shadow:rgba(20,26,28,.22);
}
[data-theme="dark"]{
  --paper:#101416; --surface:#191F22; --ink:#E7EDEA; --muted:#8B979C;
  --line:#242C30; --line-strong:#3A454A;
  --signal:#46A583; --warn:#D3924A; --behind:#D06B62;
  --signal-soft:#17322A; --warn-soft:#33261A;
  --shadow:rgba(0,0,0,.55);
}
[data-theme="halloween"]{
  --paper:#141010; --surface:#1E1817; --ink:#F2E6D4; --muted:#A08B76;
  --line:#2B211D; --line-strong:#48342A;
  --signal:#E4761B; --warn:#8E5CC4; --behind:#C0392B;
  --signal-soft:#33200F; --warn-soft:#241A33;
  --shadow:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  transition:background .3s ease,color .3s ease;
}
[data-theme="halloween"] body{
  background-image:radial-gradient(120% 60% at 50% -10%, rgba(228,118,27,.13), transparent 60%);
  background-attachment:fixed;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:4px}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif}

.shell{max-width:940px;margin:0 auto;padding:0 20px 130px}
.masthead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:26px 0 16px;flex-wrap:wrap}
.wordmark{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:27px;letter-spacing:-.015em;margin:0;display:flex;align-items:center;gap:9px}
.pumpkin{display:none;font-size:20px}
[data-theme="halloween"] .pumpkin{display:inline}
.datestamp{color:var(--muted);font-size:13px}
.masthead-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ghost{background:none;border:1px solid var(--line-strong);padding:5px 11px;border-radius:999px;font-size:12.5px;color:var(--muted);transition:border-color .18s,color .18s}
.ghost:hover{border-color:var(--ink);color:var(--ink)}
select.ghost{padding-right:22px}

.tabs{position:relative;display:flex;gap:24px;border-bottom:1px solid var(--line-strong);margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:0 0 11px;font-size:14.5px;color:var(--muted);white-space:nowrap;transition:color .2s}
.tab[aria-selected="true"]{color:var(--ink)}
.tab-underline{position:absolute;bottom:-1px;height:2px;background:var(--ink);transition:transform .34s cubic-bezier(.2,.7,.3,1),width .34s cubic-bezier(.2,.7,.3,1)}
.panel{display:none;animation:enter .3s cubic-bezier(.2,.7,.3,1)}
.panel.is-active{display:block}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.group-label{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:15px;color:var(--muted);margin:26px 0 9px;font-style:italic}
.group-label:first-child{margin-top:4px}
.row{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:14px 16px;margin-bottom:8px;
  display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
  transition:border-color .2s;
}
.row:hover{border-color:var(--line-strong)}
.row.is-done{border-color:var(--signal);background:var(--signal-soft)}
.row.is-group{border-style:solid;background:var(--surface)}
.row.is-child{margin-left:24px;border-left:3px solid var(--line-strong)}
.row-name{font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.is-group .row-name{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:17px}
.row-sub{color:var(--muted);font-size:12.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.pip{width:7px;height:7px;border-radius:50%;flex:none}
.row-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}

.check{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;transition:background .22s,border-color .22s,transform .22s}
.check svg{width:17px;height:17px;stroke:var(--line-strong);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:stroke .22s}
.check[aria-pressed="true"]{background:var(--signal);border-color:var(--signal)}
.check[aria-pressed="true"] svg{stroke:var(--surface)}
.check:active{transform:scale(.92)}

.num-input{width:80px;padding:7px 9px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);text-align:right;font-variant-numeric:tabular-nums}
.num-input:focus{border-color:var(--signal)}
.time-input{width:104px;padding:7px 9px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface)}
.mini{background:var(--ink);color:var(--paper);border:0;border-radius:7px;padding:8px 13px;font-size:13px;transition:opacity .18s}
.mini:hover{opacity:.85}
.mini.secondary{background:none;color:var(--muted);border:1px solid var(--line-strong)}
.mini.secondary:hover{color:var(--ink);border-color:var(--ink)}
.mini.danger{background:none;color:var(--behind);border:1px solid var(--behind)}
.icon-btn{background:none;border:1px solid var(--line-strong);border-radius:7px;width:30px;height:30px;color:var(--muted);font-size:15px;line-height:1;display:grid;place-items:center}
.icon-btn:hover{color:var(--ink);border-color:var(--ink)}

.meter{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:9px;grid-column:1/-1}
.meter i{display:block;height:100%;background:var(--signal);width:0;transition:width .6s cubic-bezier(.2,.7,.3,1)}

.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px 14px;margin-bottom:12px}
.chart-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.chart-picker{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px}
.chart-picker button{background:none;border:0;padding:4px 10px;border-radius:999px;font-size:12px;color:var(--muted);transition:background .2s,color .2s}
.chart-picker button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
svg.plot{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}

.insight{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line-strong);border-radius:10px;padding:14px 16px;margin-bottom:8px}
.insight.good{border-left-color:var(--signal)}
.insight.watch{border-left-color:var(--warn)}
.insight.behind{border-left-color:var(--behind)}
.insight h4{margin:0 0 3px;font-size:14.5px;font-weight:600}
.insight p{margin:0;color:var(--muted);font-size:13.5px}
.insight .lead{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:16px;color:var(--ink);margin-bottom:4px}

.chat{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:26px;overflow:hidden}
.chat-log{padding:16px;max-height:380px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.bubble{max-width:82%;padding:10px 13px;border-radius:12px;font-size:14px;white-space:pre-wrap;animation:enter .25s}
.bubble.me{align-self:flex-end;background:var(--ink);color:var(--paper);border-bottom-right-radius:4px}
.bubble.ai{align-self:flex-start;background:var(--paper);border-bottom-left-radius:4px}
.chat-form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chat-form input{flex:1;padding:10px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface)}

/* ---- calendar ---- */
.cal-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.cal-title{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:21px;min-width:190px;text-align:center}
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow{font-size:11px;color:var(--muted);text-align:center;padding-bottom:4px}
.cal-cell{
  aspect-ratio:1/1;border:1px solid var(--line);border-radius:8px;background:var(--surface);
  display:flex;flex-direction:column;justify-content:space-between;padding:6px 7px;
  font-variant-numeric:tabular-nums;transition:transform .16s,border-color .16s;position:relative;
}
.cal-cell:hover{transform:translateY(-2px);border-color:var(--line-strong)}
.cal-cell.blank{border:0;background:none;pointer-events:none}
.cal-cell.today{border-color:var(--ink);border-width:2px}
.cal-cell.sel{outline:2px solid var(--ink);outline-offset:1px}
.cal-cell.future{opacity:.4}
.cal-num{font-size:12.5px;line-height:1;text-align:left}
.cal-dots{display:flex;gap:2px;flex-wrap:wrap}
.cal-dot{width:4px;height:4px;border-radius:50%}
.scale{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin-top:14px}
.scale i{width:22px;height:10px;border-radius:3px;display:block}

.day-detail{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:18px;animation:enter .25s}
.day-detail h3{margin:0 0 2px;font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:20px;font-weight:400}
.day-detail .row-sub{margin-bottom:14px}
.edit-line{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.edit-line:first-of-type{border-top:0}
.ledger-item{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13.5px;color:var(--muted)}
.ledger-item b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}


/* ---- badges ---- */
.badge-head{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.badge-head h3{margin:0;font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:22px;font-weight:400}
.badge-head .meter{margin-top:12px}
.filters{display:flex;gap:6px;margin:14px 0 4px;flex-wrap:wrap}
.filters button{background:none;border:1px solid var(--line-strong);color:var(--muted);border-radius:999px;padding:4px 12px;font-size:12.5px;transition:background .18s,color .18s,border-color .18s}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px}
.badge{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 12px 12px;text-align:center;transition:transform .18s,border-color .18s}
.badge.earned{border-color:var(--line-strong)}
.badge:hover{transform:translateY(-2px)}
.badge-svg{width:56px;height:56px;display:block;margin:0 auto 8px}
.badge.earned .badge-svg{animation:pop .4s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.badge b{display:block;font-size:13.5px;font-weight:600;line-height:1.3}
.badge.locked b{color:var(--muted)}
.badge p{margin:4px 0 0;font-size:11.5px;color:var(--muted);line-height:1.35}
.badge .bar{height:3px;background:var(--line);border-radius:2px;margin-top:9px;overflow:hidden}
.badge .bar i{display:block;height:100%;border-radius:2px}
.badge .cnt{font-size:11px;color:var(--muted);margin-top:4px;display:block;font-variant-numeric:tabular-nums}
.badge .cnt.done{color:var(--signal)}

/* ---- settings ---- */
.set-group{border-top:1px solid var(--line);padding:16px 0 4px}
.set-group:first-of-type{border-top:0;padding-top:0}
.set-group h4{margin:0 0 3px;font-size:14px;font-weight:600}
.set-group>p{margin:0 0 12px;font-size:12.5px;color:var(--muted)}
.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0}
.toggle-row span{font-size:14px}
.toggle-row small{display:block;color:var(--muted);font-size:12px}
.sw{width:44px;height:26px;border-radius:999px;border:1px solid var(--line-strong);background:var(--paper);position:relative;flex:none;transition:background .22s,border-color .22s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .22s,background .22s}
.sw[aria-pressed="true"]{background:var(--signal);border-color:var(--signal)}
.sw[aria-pressed="true"]::after{transform:translateX(18px);background:#fff}
.theme-chips{display:flex;gap:6px;flex-wrap:wrap}
.theme-chips button{border:1px solid var(--line-strong);background:none;color:var(--muted);border-radius:8px;padding:7px 12px;font-size:13px;display:flex;align-items:center;gap:7px}
.theme-chips button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.theme-chips i{width:12px;height:12px;border-radius:3px;display:block;border:1px solid rgba(128,128,128,.35)}
.sync-state{font-size:12.5px;color:var(--muted);margin-top:10px}
.sync-state b{color:var(--ink);font-weight:600}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* ---- unlock celebration ---- */
#unlock{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;background:rgba(8,10,11,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#unlock.is-open{display:flex}
.uk-card{text-align:center;padding:30px 26px;max-width:330px}
.uk-medal{position:relative;width:150px;height:150px;margin:0 auto 20px}
.uk-medal svg{width:150px!important;height:150px!important;position:relative;z-index:2;animation:medal .8s cubic-bezier(.2,1.5,.4,1) both}
@keyframes medal{0%{transform:scale(.3) rotate(-25deg);opacity:0}60%{transform:scale(1.12) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.uk-rays{position:absolute;inset:-42px;z-index:1;animation:rays 1.1s ease-out both}
@keyframes rays{0%{transform:scale(.4) rotate(0);opacity:0}35%{opacity:.9}100%{transform:scale(1.15) rotate(28deg);opacity:0}}
.uk-ring{position:absolute;inset:0;border-radius:50%;z-index:1;animation:ring 1s ease-out .12s both}
@keyframes ring{0%{transform:scale(.6);opacity:.85}100%{transform:scale(1.9);opacity:0}}
.uk-tier{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:7px;animation:up .5s ease-out .3s both}
.uk-name{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:29px;line-height:1.15;color:#fff;margin:0 0 8px;animation:up .5s ease-out .38s both}
.uk-desc{font-size:14px;color:rgba(255,255,255,.68);margin:0 0 22px;animation:up .5s ease-out .46s both}
.uk-more{font-size:12.5px;color:rgba(255,255,255,.5);animation:up .5s ease-out .6s both}
.uk-btn{background:#fff;color:#141A1C;border:0;border-radius:999px;padding:11px 26px;font-size:14px;animation:up .5s ease-out .54s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.uk-spark{position:absolute;top:50%;left:50%;width:6px;height:6px;border-radius:50%;z-index:3;animation:spark .9s ease-out both}

/* ---- digest ---- */
.digest{background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:18px;margin-bottom:14px}
.digest .big{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.digest .delta{font-size:13px;margin-left:8px}
.digest .delta.up{color:var(--signal)}
.digest .delta.down{color:var(--behind)}
.digest ul{margin:14px 0 0;padding:0;list-style:none}
.digest li{font-size:13.5px;padding:7px 0 7px 14px;border-left:2px solid var(--line);color:var(--muted)}
.digest li b{color:var(--ink);font-weight:600}
.digest li.act{border-left-color:var(--warn)}
.digest li.win{border-left-color:var(--signal)}
.spark-row{display:flex;gap:3px;align-items:flex-end;height:34px;margin-top:14px}
.spark-row i{flex:1;background:var(--signal);border-radius:2px;min-height:2px;opacity:.85}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.scrim.is-open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surface);width:100%;max-width:530px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:22px 22px 26px;animation:rise .32s cubic-bezier(.2,.7,.3,1)}
@keyframes rise{from{transform:translateY(28px)}to{transform:none}}
@media(min-width:640px){.scrim{align-items:center}.sheet{border-radius:14px;animation:enter .28s}}
.sheet h3{margin:0 0 6px;font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:21px;font-weight:400}
.sheet-sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface)}
.field input:focus,.field select:focus{border-color:var(--signal)}
.field-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;transition:transform .18s}
.swatch[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.12)}
.sheet-actions{display:flex;gap:8px;justify-content:space-between;margin-top:20px;flex-wrap:wrap}
.hist-line{display:grid;grid-template-columns:88px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.hist-line span{color:var(--muted)}
.hist-wrap{max-height:300px;overflow-y:auto;margin-top:6px}

.empty{border:1px dashed var(--line-strong);border-radius:10px;padding:26px 20px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 14px}
.templates{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.fab{position:fixed;right:max(20px,calc(50% - 450px));bottom:24px;z-index:20;background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:13px 20px;font-size:14px;box-shadow:0 6px 20px var(--shadow);transition:transform .2s}
.fab:hover{transform:translateY(-2px)}
.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,14px);z-index:60;background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.is-shown{opacity:1;transform:translate(-50%,0)}
.note{font-size:12.5px;color:var(--muted);padding:10px 14px;background:var(--warn-soft);border-radius:8px;margin-top:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="shell">
  <header class="masthead">
    <div>
      <h1 class="wordmark"><span class="pumpkin">🎃</span>Baseline</h1>
      <div class="datestamp" id="datestamp"></div>
    </div>
    <div class="masthead-tools">
      <button class="ghost" id="btn-sync" title="Sync now">Sync</button>
      <button class="ghost" id="btn-settings">Settings</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="track" aria-selected="true">Trackers</button>
    <button class="tab" role="tab" data-tab="days" aria-selected="false">Days</button>
    <button class="tab" role="tab" data-tab="badges" aria-selected="false">Badges</button>
    <button class="tab" role="tab" data-tab="progress" aria-selected="false">Progress</button>
    <button class="tab" role="tab" data-tab="insights" aria-selected="false">Updates</button>
    <span class="tab-underline" id="underline"></span>
  </nav>

  <main id="swipe-area">
    <section class="panel is-active" data-panel="track" id="panel-track"></section>
    <section class="panel" data-panel="days" id="panel-days"></section>
    <section class="panel" data-panel="badges" id="panel-badges"></section>
    <section class="panel" data-panel="progress" id="panel-progress"></section>
    <section class="panel" data-panel="insights" id="panel-insights"></section>
  </main>
</div>

<button class="fab" id="btn-new">New tracker</button>
<div class="toast" id="toast"></div>
<input type="file" id="file-input" accept="application/json" hidden>
<div id="unlock"><div class="uk-card" id="uk-card"></div></div>
<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>

<script>
"use strict";

/* ===== 1. STORAGE ===== */
const KEY = "baseline:v2";
const Store = (() => {
  let mode = "memory", mem = null;
  return {
    async init(){
      if (typeof window !== "undefined" && window.storage) {
        try { await window.storage.list(""); mode = "claude"; return; } catch(e){}
      }
      try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); mode = "local"; }
      catch(e){ mode = "memory"; }
    },
    async load(){
      try {
        if (mode === "claude"){ const r = await window.storage.get(KEY); return r ? JSON.parse(r.value) : null; }
        if (mode === "local"){ const v = localStorage.getItem(KEY) || localStorage.getItem("baseline:v1"); return v ? JSON.parse(v) : null; }
        return mem;
      } catch(e){ return null; }
    },
    async save(d){
      try {
        if (mode === "claude"){ await window.storage.set(KEY, JSON.stringify(d)); return true; }
        if (mode === "local"){ localStorage.setItem(KEY, JSON.stringify(d)); return true; }
        mem = d; return true;
      } catch(e){ return false; }
    }
  };
})();

/* ===== 2. DATES ===== */
const iso = d => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`; };
const today = () => iso(new Date());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const daysBetween = (a,b) => Math.round((parse(b) - parse(a)) / 86400000);
const monthKey = s => s.slice(0,7);
function weekStart(s){ const d = parse(s); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return iso(d); }
function lastNDays(n){ const o=[]; for(let i=n-1;i>=0;i--) o.push(addDays(today(),-i)); return o; }
const prettyDate = s => parse(s).toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric"});
const shortDate  = s => parse(s).toLocaleDateString(undefined,{month:"short", day:"numeric"});
const monthName  = k => new Date(+k.slice(0,4), +k.slice(5,7)-1, 1).toLocaleDateString(undefined,{month:"long", year:"numeric"});

/* ===== 3. TYPES ===== */
const TYPES = {
  habit:   { label:"Daily habits",    unitDefault:"",     periodDefault:"week",  charts:["progress","bar","pie","line"] },
  count:   { label:"Daily counts",    unitDefault:"reps", periodDefault:"day",   charts:["line","bar","progress","pie"] },
  hours:   { label:"Hours logged",    unitDefault:"h",    periodDefault:"week",  charts:["bar","line","progress","pie"] },
  savings: { label:"Savings goals",   unitDefault:"$",    periodDefault:"total", charts:["progress","line","bar","pie"] },
  sleep:   { label:"Sleep",           unitDefault:"h",    periodDefault:"day",   charts:["line","bar","progress","pie"] },
  ledger:  { label:"Income & bills",  unitDefault:"$",    periodDefault:"month", charts:["bar","pie","line","progress"] }
};
const ORDER = ["habit","count","hours","sleep","savings","ledger"];
const COLORS = ["#15624B","#2A6FA8","#B23A3A","#C4761B","#6B4C9A","#1F8F86","#8C7A2E","#4A5A64"];
const CHART_LABEL = { line:"Line", bar:"Bar", pie:"Split", progress:"Progress" };
const MONEY_TYPES = ["savings","ledger"];

/* ===== 4. STATE ===== */
const DEFAULT_SETTINGS = {
  theme:"light",
  notifyOn:false, notifyTime:"20:00", lastNotify:null,
  apiKey:"", sbUrl:"", sbAnon:"", sbEmail:"", sbToken:"", sbRefresh:"", lastSync:null
};
let S = { trackers:[], entries:[], chat:[], unlocked:null, tombstones:[], updatedAt:0, settings:{...DEFAULT_SETTINGS} };
const uid = () => Math.random().toString(36).slice(2,9);
let saveTimer;
function persist(){
  S.updatedAt = Date.now();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ Store.save(S); queueSync(); }, 220);
}
function tomb(kind, id){
  S.tombstones = S.tombstones || [];
  S.tombstones.push({ kind, id, at: Date.now() });
  if (S.tombstones.length > 800) S.tombstones = S.tombstones.slice(-800);
}

const byId = id => S.trackers.find(t=>t.id===id);
const childrenOf = id => S.trackers.filter(t=>t.parentId===id && !t.archived);
const isGroup = t => childrenOf(t.id).length > 0;
function familyIds(id){
  const out = [id];
  childrenOf(id).forEach(c => out.push(...familyIds(c.id)));
  return out;
}
const entriesFor = id => {
  const fam = familyIds(id);
  return S.entries.filter(e => fam.includes(e.trackerId)).sort((a,b)=> a.date < b.date ? -1 : 1);
};
const ownEntryOn = (id,d) => S.entries.find(e => e.trackerId === id && e.date === d);
function aggValueOn(id, d){
  return familyIds(id).reduce((s,fid)=>{
    return s + S.entries.filter(e=>e.trackerId===fid && e.date===d)
      .reduce((a,e)=> a + (e.kind==="out" ? -e.value : e.value), 0);
  }, 0);
}

function setEntry(id, date, value, extra){
  let e = ownEntryOn(id, date);
  if (!e){ e = { id:uid(), trackerId:id, date, value:0 }; S.entries.push(e); }
  e.value = value;
  if (extra) Object.assign(e, extra);
  persist();
}
function removeEntry(id, date){
  const i = S.entries.findIndex(e => e.trackerId===id && e.date===date);
  if (i > -1){ tomb("entry", S.entries[i].id); S.entries.splice(i,1); persist(); }
}
function removeEntryById(eid){
  const i = S.entries.findIndex(e => e.id === eid);
  if (i > -1){ tomb("entry", eid); S.entries.splice(i,1); persist(); }
}
function addLedgerEntry(id, kind, amount, date, label){
  S.entries.push({ id:uid(), trackerId:id, date:date||today(), value:Math.abs(amount), kind, label:label||"" });
  persist();
}
function deleteTracker(id){
  const fam = familyIds(id);
  fam.forEach(f => tomb("tracker", f));
  S.entries.filter(e=>fam.includes(e.trackerId)).forEach(e=>tomb("entry", e.id));
  S.trackers = S.trackers.filter(t => !fam.includes(t.id));
  S.entries  = S.entries.filter(e => !fam.includes(e.trackerId));
  persist();
}

/* effective targets roll up from children when the parent leaves them blank */
function effTarget(t){
  if (t.target) return t.target;
  const kids = childrenOf(t.id);
  if (!kids.length) return null;
  const s = kids.reduce((a,k)=> a + (effTarget(k)||0), 0);
  return s || null;
}
function effGoal(t){
  if (t.goalAmount) return t.goalAmount;
  const kids = childrenOf(t.id);
  if (!kids.length) return null;
  const s = kids.reduce((a,k)=> a + (effGoal(k)||0), 0);
  return s || null;
}

/* ===== 5. STATS ===== */
function stats(t){
  const es = entriesFor(t.id);
  const out = { entries:es, count:es.length, target:effTarget(t), goal:effGoal(t) };

  if (t.type === "savings"){
    out.saved = es.reduce((s,e)=>s+e.value,0);
    out.pct = out.goal ? Math.min(1, out.saved/out.goal) : 0;
    out.remaining = Math.max(0, (out.goal||0) - out.saved);
    const first = es[0] ? es[0].date : today();
    const weeks = Math.max(1, daysBetween(first, today())/7);
    out.perWeek = out.saved/weeks;
    out.weeksLeft = out.perWeek > 0 ? out.remaining/out.perWeek : Infinity;
    if (t.deadline){
      out.daysLeft = daysBetween(today(), t.deadline);
      out.neededPerWeek = out.daysLeft > 0 ? out.remaining/(out.daysLeft/7) : out.remaining;
    }
    return out;
  }

  if (t.type === "ledger"){
    const m = {};
    es.forEach(e => { const k = monthKey(e.date); m[k] = m[k] || {in:0,out:0}; m[k][e.kind==="out"?"out":"in"] += e.value; });
    const keys = Object.keys(m).sort();
    out.months = m; out.monthKeys = keys;
    const cur = m[monthKey(today())] || {in:0,out:0};
    out.thisIn = cur.in; out.thisOut = cur.out; out.thisNet = cur.in - cur.out;
    const closed = keys.filter(k=>k!==monthKey(today()));
    out.avgOut = closed.length ? closed.reduce((s,k)=>s+m[k].out,0)/closed.length : cur.out;
    out.avgIn  = closed.length ? closed.reduce((s,k)=>s+m[k].in,0)/closed.length  : cur.in;
    return out;
  }

  const win = lastNDays(30);
  out.series = win.map(d => ({ date:d, value: aggValueOn(t.id, d) }));
  const last7 = out.series.slice(-7);
  out.week7 = last7.reduce((s,p)=>s+p.value,0);
  out.avg7 = out.week7/7;
  out.doneToday = aggValueOn(t.id, today()) > 0;

  if (t.type === "habit"){
    out.hits30 = out.series.filter(p=>p.value>0).length;
    out.hitsWeek = last7.filter(p=>p.value>0).length;
    let streak = 0;
    for (let i=0;;i++){
      const v = aggValueOn(t.id, addDays(today(),-i));
      if (v > 0) streak++;
      else if (i === 0) continue;
      else break;
      if (i > 400) break;
    }
    out.streak = streak;
    out.targetDays = out.target || 7;
    out.isGroup = isGroup(t);
    out.sessions = out.week7;                       // counts each subsection separately
    out.scored = out.isGroup ? out.sessions : out.hitsWeek;
    out.unitWord = out.isGroup ? "sessions" : "days";
    out.pct = Math.min(1, out.scored/out.targetDays);
  } else if (t.type === "sleep"){
    const logged = last7.filter(p=>p.value>0);
    out.avgNight = logged.length ? logged.reduce((s,p)=>s+p.value,0)/logged.length : 0;
    out.current = aggValueOn(t.id, today());
    out.pct = out.target ? Math.min(1, out.avgNight/out.target) : 0;
  } else {
    out.current = t.targetPeriod === "week" ? out.week7 : aggValueOn(t.id, today());
    out.pct = out.target ? Math.min(1, out.current/out.target) : 0;
  }
  return out;
}

/* ===== 6. COLOUR HELPERS ===== */
const hex2rgb = h => { h = h.replace("#",""); return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)); };
const rgb2hex = a => "#" + a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join("");
const mixRgb = (a,b,t) => a.map((v,i)=> v + (b[i]-v)*t);
const lum = a => { const c = a.map(v=>{ v/=255; return v<=.03928 ? v/12.92 : ((v+.055)/1.055)**2.4; }); return .2126*c[0]+.7152*c[1]+.0722*c[2]; };
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function themed(hex){
  if (S.settings.theme === "light") return hex;
  return rgb2hex(mixRgb(hex2rgb(hex), [255,255,255], .3));
}
function palette(){
  return { line:cssVar("--line"), lineStrong:cssVar("--line-strong"), muted:cssVar("--muted"), ink:cssVar("--ink"), behind:cssVar("--behind"), surface:cssVar("--surface"), paper:cssVar("--paper") };
}

/* ===== 7. CHARTS ===== */
const W = 340, H = 132, PAD = 6;
const SERIF = "Iowan Old Style,Palatino,Georgia,serif";

function chartData(t, st){
  if (t.type === "savings"){
    let run = 0;
    const pts = st.entries.map(e => ({ label:shortDate(e.date), value:(run += e.value) }));
    return pts.length ? pts : [{label:"—", value:0}];
  }
  if (t.type === "ledger"){
    return st.monthKeys.slice(-8).map(k => ({ label:k.slice(5)+"/"+k.slice(2,4), value:st.months[k].in - st.months[k].out }));
  }
  return st.series.slice(-14).map(p => ({ label:shortDate(p.date), value:p.value }));
}

function lineChart(data, color){
  const P = palette();
  const vals = data.map(d=>d.value);
  const max = Math.max(1,...vals), min = Math.min(0,...vals), span = max-min || 1;
  const x = i => PAD + (i*(W-PAD*2))/Math.max(1,data.length-1);
  const y = v => H - PAD - ((v-min)/span)*(H-PAD*2);
  const pts = data.map((d,i)=>[x(i),y(d.value)]);
  const path = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area = path + ` L${x(data.length-1).toFixed(1)} ${H-PAD} L${PAD} ${H-PAD} Z`;
  const grid = [0,.5,1].map(f=>`<line x1="${PAD}" x2="${W-PAD}" y1="${(PAD+f*(H-PAD*2)).toFixed(1)}" y2="${(PAD+f*(H-PAD*2)).toFixed(1)}" stroke="${P.line}" stroke-width="1"/>`).join("");
  const dots = pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.4" fill="${color}"/>`).join("");
  return `<svg class="plot" viewBox="0 0 ${W} ${H+18}">${grid}
    <path d="${area}" fill="${color}" opacity=".10"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}
    <text x="${PAD}" y="${H+13}" font-size="10" fill="${P.muted}">${data[0].label}</text>
    <text x="${W-PAD}" y="${H+13}" font-size="10" fill="${P.muted}" text-anchor="end">${data[data.length-1].label}</text></svg>`;
}

function barChart(data, color){
  const P = palette();
  const max = Math.max(1,...data.map(d=>Math.abs(d.value)));
  const n = data.length, gap = 4, bw = (W-PAD*2-gap*(n-1))/n;
  const bars = data.map((d,i)=>{
    const h = (Math.abs(d.value)/max)*(H-PAD*2);
    return `<rect x="${(PAD+i*(bw+gap)).toFixed(1)}" y="${(H-PAD-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,h).toFixed(1)}" rx="2" fill="${d.value<0?P.behind:color}" opacity="${d.value===0?.18:1}"/>`;
  }).join("");
  const labels = data.map((d,i)=> (n<=8||i%2===0) ? `<text x="${(PAD+i*(bw+gap)+bw/2).toFixed(1)}" y="${H+13}" font-size="9" fill="${P.muted}" text-anchor="middle">${d.label}</text>` : "").join("");
  return `<svg class="plot" viewBox="0 0 ${W} ${H+18}"><line x1="${PAD}" x2="${W-PAD}" y1="${H-PAD}" y2="${H-PAD}" stroke="${P.lineStrong}" stroke-width="1"/>${bars}${labels}</svg>`;
}

function pieChart(slices){
  const P = palette();
  const total = slices.reduce((s,x)=>s+Math.max(0,x.value),0) || 1;
  const cx = 72, cy = 66, r = 54;
  let a0 = -Math.PI/2, arcs = "";
  slices.forEach(s=>{
    const v = Math.max(0,s.value);
    if (v <= 0) return;
    const a1 = a0 + (v/total)*Math.PI*2;
    const big = (a1-a0) > Math.PI ? 1 : 0;
    const p0 = [cx+r*Math.cos(a0), cy+r*Math.sin(a0)], p1 = [cx+r*Math.cos(a1), cy+r*Math.sin(a1)];
    arcs += `<path d="M${cx} ${cy} L${p0[0].toFixed(1)} ${p0[1].toFixed(1)} A${r} ${r} 0 ${big} 1 ${p1[0].toFixed(1)} ${p1[1].toFixed(1)} Z" fill="${s.color}" stroke="${P.surface}" stroke-width="1.5"/>`;
    a0 = a1;
  });
  const rows = slices.slice(0,5).map((s,i)=>`<g transform="translate(158 ${34+i*21})">
      <rect width="9" height="9" rx="2" fill="${s.color}"/>
      <text x="16" y="9" font-size="11.5" fill="${P.ink}">${s.label}</text>
      <text x="${W-160}" y="9" font-size="11.5" fill="${P.muted}" text-anchor="end">${s.display ?? s.value}</text></g>`).join("");
  return `<svg class="plot" viewBox="0 0 ${W} ${H+8}">${arcs}${rows}</svg>`;
}

function progressChart(pct, caption, color){
  const P = palette();
  const cx = 70, cy = 66, r = 48, c = 2*Math.PI*r;
  const dash = Math.max(0,Math.min(1,pct))*c;
  return `<svg class="plot" viewBox="0 0 ${W} ${H+8}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${P.line}" stroke-width="11"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${dash.toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"/>
    <text x="${cx}" y="${cy+7}" font-size="21" text-anchor="middle" fill="${P.ink}" style="font-family:${SERIF}">${Math.round(pct*100)}%</text>
    <text x="150" y="${cy+5}" font-size="12.5" fill="${P.muted}">${caption}</text></svg>`;
}

function renderChart(t, st){
  const kind = t.chart || TYPES[t.type].charts[0];
  const color = themed(t.color || COLORS[0]);
  const P = palette();
  const money = MONEY_TYPES.includes(t.type);
  const fm = v => money ? "$"+Math.round(v).toLocaleString() : (Math.round(v*10)/10);
  const kids = childrenOf(t.id);

  if (kind === "line") return lineChart(chartData(t,st), color);
  if (kind === "bar")  return barChart(chartData(t,st), color);

  if (kind === "pie"){
    if (kids.length){
      const slices = kids.map(k=>{
        const ks = stats(k);
        let v = 0;
        if (k.type === "savings") v = ks.saved;
        else if (k.type === "ledger") v = ks.thisOut;
        else if (k.type === "habit") v = ks.hits30;
        else v = ks.series.reduce((s,p)=>s+p.value,0);
        return { label:k.name, value:v, display:fm(v), color:themed(k.color||COLORS[0]) };
      });
      return pieChart(slices);
    }
    if (t.type === "savings") return pieChart([{label:"Saved",value:st.saved,display:fm(st.saved),color},{label:"To go",value:st.remaining,display:fm(st.remaining),color:P.lineStrong}]);
    if (t.type === "ledger")  return pieChart([{label:"In",value:st.thisIn,display:fm(st.thisIn),color},{label:"Out",value:st.thisOut,display:fm(st.thisOut),color:P.lineStrong}]);
    if (t.type === "habit")   return pieChart([{label:"Done",value:st.hits30,display:st.hits30,color},{label:"Missed",value:30-st.hits30,display:30-st.hits30,color:P.lineStrong}]);
    const hit = st.series.filter(p=>p.value>0).length;
    return pieChart([{label:"Logged",value:hit,display:hit,color},{label:"Blank",value:30-hit,display:30-hit,color:P.lineStrong}]);
  }

  if (t.type === "savings") return progressChart(st.pct, st.goal ? `${fm(st.saved)} of ${fm(st.goal)}` : `${fm(st.saved)} saved, no target`, color);
  if (t.type === "ledger"){
    const p = st.thisIn ? Math.min(1, st.thisOut/st.thisIn) : 0;
    return progressChart(p, `${fm(st.thisOut)} out of ${fm(st.thisIn)} in`, color);
  }
  if (t.type === "habit")  return progressChart(st.pct, `${st.scored} of ${st.targetDays} ${st.unitWord} this week`, color);
  if (t.type === "sleep")  return progressChart(st.pct, `${st.avgNight.toFixed(1)}h average vs ${st.target||8}h`, color);
  return progressChart(st.pct, `${fm(st.current)} of ${fm(st.target||0)}${t.unit||""} ${t.targetPeriod==="week"?"this week":"today"}`, color);
}

/* ===== 8. INSIGHTS ===== */
const plural = (n,w) => `${n} ${w}${n===1?"":"s"}`;
function humanWeeks(w){
  if (!isFinite(w)) return null;
  if (w < 1.5) return "about a week";
  if (w < 9) return `about ${Math.round(w)} weeks`;
  const m = w/4.345;
  return m < 18 ? `about ${Math.round(m)} months` : `about ${(m/12).toFixed(1)} years`;
}

function insightFor(t){
  const st = stats(t);
  const money = v => "$"+Math.round(v).toLocaleString();

  if (t.type === "savings"){
    if (!st.goal) return { tone:"watch", lead:"No target set", detail:`${money(st.saved)} put aside. Add a goal amount and this projects a finish date.`, gap:.4 };
    if (st.pct >= 1) return { tone:"good", lead:"Goal reached", detail:`${money(st.saved)} of ${money(st.goal)}.`, gap:0 };
    let detail = st.perWeek > 0
      ? `Averaging ${money(st.perWeek)} a week. At that rate you reach ${money(st.goal)} in ${humanWeeks(st.weeksLeft)}.`
      : `Nothing added yet, so there's no rate to project from.`;
    let tone = "good", gap = 1 - st.pct;
    if (t.deadline && isFinite(st.neededPerWeek)){
      const short = st.neededPerWeek - st.perWeek;
      if (short > .5){
        tone = short > st.perWeek*.5 ? "behind" : "watch";
        detail += ` Your ${st.daysLeft > 0 ? plural(st.daysLeft,"day") + " deadline" : "deadline"} needs ${money(st.neededPerWeek)} a week — ${money(short)} more than you're managing.`;
        gap = Math.min(1, short/Math.max(1,st.neededPerWeek));
      } else detail += ` That's ahead of what the deadline needs.`;
    } else if (st.perWeek <= 0){ tone = "behind"; gap = 1; }
    return { tone, lead:`${Math.round(st.pct*100)}% of the way there`, detail, gap };
  }

  if (t.type === "ledger"){
    const net = st.thisNet;
    return {
      tone: net < 0 ? "behind" : net < st.avgIn*.1 ? "watch" : "good",
      lead: `${net<0?"−":""}${money(Math.abs(net))} net this month`,
      detail: `${money(st.thisIn)} in, ${money(st.thisOut)} out. Average bills run ${money(st.avgOut)} a month against ${money(st.avgIn)} income.`,
      gap: net < 0 ? Math.min(1, Math.abs(net)/Math.max(1,st.avgIn)) : .1
    };
  }

  if (t.type === "habit"){
    const need = st.targetDays, got = st.scored, w = st.unitWord, rate = st.hits30/30*7;
    if (got >= need) return { tone:"good", lead:`${got} of ${need} ${w} this week`, detail:`Target met${st.streak>1?`, ${plural(st.streak,"day")} streak running`:""}. 30-day pace is ${rate.toFixed(1)} days a week.`, gap:0 };
    const left = 7 - (daysBetween(weekStart(today()), today()) + 1);
    const short = need - got;
    return {
      tone: short > left ? "behind" : "watch",
      lead: `${got} of ${need} ${w} this week`,
      detail: short > left
        ? `Only ${plural(left,"day")} left in the week, so this one can't be caught up. 30-day pace is ${rate.toFixed(1)} days a week.`
        : `${short} more needed with ${plural(left,"day")} left.`,
      gap: short/need
    };
  }

  if (t.type === "sleep"){
    const target = st.target || 8;
    if (!st.avgNight) return { tone:"watch", lead:"Nothing logged this week", detail:"Log a few nights to see your average and how steady the schedule is.", gap:.5 };
    const diff = st.avgNight - target;
    const beds = st.entries.slice(-7).map(e=>e.bed).filter(Boolean);
    let spread = "";
    if (beds.length > 2){
      const mins = beds.map(b=>{ const [h,m]=b.split(":").map(Number); return (h<12?h+24:h)*60+m; });
      const mean = mins.reduce((a,b)=>a+b,0)/mins.length;
      const sd = Math.sqrt(mins.reduce((s,x)=>s+(x-mean)**2,0)/mins.length);
      spread = sd > 60 ? ` Bedtime swings about ${Math.round(sd)} minutes night to night — a bigger issue than the total.` : ` Bedtime holds within ${Math.round(sd)} minutes.`;
    }
    if (diff >= -.4) return { tone:"good", lead:`${st.avgNight.toFixed(1)}h average`, detail:`At or above your ${target}h target.${spread}`, gap:0 };
    return { tone: diff < -1.2 ? "behind":"watch", lead:`${st.avgNight.toFixed(1)}h average`, detail:`${Math.abs(diff).toFixed(1)}h short of ${target}h — roughly ${Math.round(Math.abs(diff)*7)}h of debt a week.${spread}`, gap:Math.min(1,Math.abs(diff)/target) };
  }

  const unit = t.unit || "", cur = st.current, target = st.target;
  if (!target) return { tone:"watch", lead:`${cur}${unit} logged`, detail:`Set a target and this tells you whether you're on pace.`, gap:.4 };
  if (st.pct >= 1) return { tone:"good", lead:`${cur}${unit} of ${target}${unit}`, detail:`Target hit. 7-day average is ${st.avg7.toFixed(1)}${unit} a day.`, gap:0 };
  if (t.targetPeriod === "week"){
    const elapsed = daysBetween(weekStart(today()), today()) + 1;
    const off = target*(elapsed/7) - cur;
    const left = 7 - elapsed;
    const perDay = left > 0 ? (target-cur)/left : (target-cur);
    return {
      tone: off > target*.2 ? "behind" : off > 0 ? "watch" : "good",
      lead: `${cur}${unit} of ${target}${unit} this week`,
      detail: off > 0
        ? `${off.toFixed(1)}${unit} behind pace on day ${elapsed}. You'd need ${perDay.toFixed(1)}${unit} a day across the ${plural(left,"day")} left.`
        : `Ahead of pace on day ${elapsed}.`,
      gap: Math.max(0, off/target)
    };
  }
  return { tone: st.pct < .5 ? "behind":"watch", lead:`${cur}${unit} of ${target}${unit} today`, detail:`${(target-cur).toFixed(1)}${unit} to go. 7-day average is ${st.avg7.toFixed(1)}${unit}.`, gap:1-st.pct };
}

function renderTrack(){
  const el = $("#panel-track");
  const live = S.trackers.filter(t=>!t.archived);
  if (!live.length){ el.innerHTML = emptyState(); return; }
  let html = "";
  ORDER.forEach(type=>{
    const tops = live.filter(t=>t.type===type && !t.parentId);
    if (!tops.length) return;
    html += `<div class="group-label">${TYPES[type].label}</div>`;
    tops.forEach(t=>{

function subtitleFor(t, group){

    return st.goal ? `${money(st.saved)} of ${money(st.goal)} · ${money(st.perWeek)}/wk average` : `${money(st.saved)} put aside`;

/* ===== 11. RENDER: DAYS ===== */
let calMonth = monthKey(today());
let calMetric = "all";
let calSelected = null;

function dayScore(date, metric){
  // returns {score 0..1, dots:[colors]} relative to the best day in the visible month
  const pool = metric === "all"
    ? S.trackers.filter(t=>!t.archived && !isGroup(t))
    : [byId(metric)].filter(Boolean);
  const scores = [], dots = [];
  pool.forEach(t=>{
    const v = aggValueOn(t.id, date);
    if (v === 0) return;
    let norm;
    if (t.type === "habit") norm = 1;
    else {
      const ref = monthMax(t.id);
      const target = effTarget(t);
      const basis = t.type === "savings" || t.type === "ledger" ? ref : (target || ref);
      norm = basis ? Math.min(1, Math.abs(v)/basis) : 1;
    }
    scores.push(norm);
    dots.push(themed(t.color || COLORS[0]));
  });
  if (!scores.length) return { score:0, dots:[] };
  const avg = scores.reduce((a,b)=>a+b,0)/scores.length;
  const breadth = metric === "all" ? Math.min(1, scores.length / Math.max(1, pool.length)) : 1;
  return { score: Math.max(.12, avg*0.65 + breadth*0.35), dots };
}

const _maxCache = {};
function monthMax(id){
  const k = id + calMonth;
  if (_maxCache[k] !== undefined) return _maxCache[k];
  let m = 0;
  daysInMonth(calMonth).forEach(d => { m = Math.max(m, Math.abs(aggValueOn(id, d))); });
  _maxCache[k] = m || 1;
  return _maxCache[k];
}
function daysInMonth(k){
  const y = +k.slice(0,4), mo = +k.slice(5,7);
  const n = new Date(y, mo, 0).getDate();
  return Array.from({length:n}, (_,i)=> `${k}-${String(i+1).padStart(2,"0")}`);
}
function shiftMonth(k, n){
  const y = +k.slice(0,4), mo = +k.slice(5,7) - 1 + n;
  const d = new Date(y, mo, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}

function renderDays(){
  const el = $("#panel-days");
  const live = S.trackers.filter(t=>!t.archived);
  if (!live.length){ el.innerHTML = `<div class="empty"><p>The calendar fills in once you're tracking something.</p></div>`; return; }
  Object.keys(_maxCache).forEach(k=>delete _maxCache[k]);

  const opts = `<option value="all" ${calMetric==="all"?"selected":""}>Everything combined</option>` +
    live.filter(t=>!isGroup(t)).map(t=>`<option value="${t.id}" ${calMetric===t.id?"selected":""}>${esc(t.name)}</option>`).join("");

  const days = daysInMonth(calMonth);
  const lead = (parse(days[0]).getDay()+6)%7;
  const P = palette();
  const accent = calMetric === "all" ? cssVar("--signal") : themed(byId(calMetric)?.color || COLORS[0]);
  const accentRgb = hex2rgb(accent.startsWith("#") ? accent : "#15624B");
  const surfRgb = hex2rgb(P.surface.startsWith("#") ? P.surface : "#FFFFFF");

  let cells = "";
  for (let i=0;i<lead;i++) cells += `<div class="cal-cell blank"></div>`;
  days.forEach(d=>{
    const { score, dots } = dayScore(d, calMetric);
    const future = d > today();
    const mixed = mixRgb(surfRgb, accentRgb, future ? 0 : score * .85);
    const text = lum(mixed) > .5 ? "#141A1C" : "#FFFFFF";
    const cls = ["cal-cell", d===today()?"today":"", d===calSelected?"sel":"", future?"future":""].filter(Boolean).join(" ");
    cells += `<div class="${cls}" data-day="${d}" role="button" tabindex="0" style="background:${rgb2hex(mixed)};${score>0&&!future?`color:${text}`:""}">
        <div class="cal-num">${+d.slice(8)}</div>
        <div class="cal-dots">${dots.slice(0,6).map(c=>`<i class="cal-dot" style="background:${c}"></i>`).join("")}</div>
      </div>`;
  });

  const dow = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div class="cal-dow">${d}</div>`).join("");
  el.innerHTML = `
    <div class="cal-bar">
      <div class="cal-nav">
        <button class="icon-btn" data-act="month" data-n="-1" aria-label="Previous month">‹</button>
        <div class="cal-title">${monthName(calMonth)}</div>
        <button class="icon-btn" data-act="month" data-n="1" aria-label="Next month">›</button>
      </div>
      <select class="ghost" id="cal-metric" aria-label="Shade days by">${opts}</select>
    </div>
    <div class="cal-grid">${dow}${cells}</div>
    <div class="scale">
      <span>Quiet</span>
      <i style="background:${rgb2hex(mixRgb(surfRgb,accentRgb,.12))}"></i>
      <i style="background:${rgb2hex(mixRgb(surfRgb,accentRgb,.35))}"></i>
      <i style="background:${rgb2hex(mixRgb(surfRgb,accentRgb,.6))}"></i>
      <i style="background:${rgb2hex(mixRgb(surfRgb,accentRgb,.85))}"></i>
      <span>Best day this month</span>
    </div>
    <div id="day-detail"></div>`;
  $("#cal-metric").addEventListener("change", e => { calMetric = e.target.value; renderDays(); });
  if (calSelected) renderDayDetail();
}

function renderDayDetail(){
  const host = $("#day-detail");
  if (!host || !calSelected) return;
  const d = calSelected;
  const live = S.trackers.filter(t=>!t.archived && !isGroup(t));

    const c = themed(t.color||COLORS[0]);

    if (t.type === "ledger"){
      const items = S.entries.filter(e=>e.trackerId===t.id && e.date===d);
      const list = items.length ? items.map(e=>`<div class="ledger-item"><b>${e.kind==="out"?"−":"+"}${money(e.value)}</b>${e.label?" · "+esc(e.label):""}<button class="icon-btn" data-act="del-entry" data-eid="${e.id}" aria-label="Delete entry">×</button></div>`).join("") : `<div class="ledger-item">Nothing logged</div>`;
      return `<div class="edit-line"><div>${name}${list}</div>

        </div></div>`;
    }
    const e = ownEntryOn(t.id, d);
    if (t.type === "habit"){
      return `<div class="edit-line">${name}<div class="row-actions">
        <button class="check" data-act="dtoggle" data-id="${t.id}" aria-pressed="${!!(e&&e.value>0)}" aria-label="Toggle ${esc(t.name)}"><svg viewBox="0 0 24 24"><polyline points="4 12.5 9.5 18 20 6.5"/></svg></button></div></div>`;
    }
    if (t.type === "sleep"){
      return `<div class="edit-line">${name}<div class="row-actions">
        <input class="time-input" type="time" data-role="dbed" data-id="${t.id}" value="${e?.bed||""}" aria-label="Bed time">
        <input class="time-input" type="time" data-role="dwake" data-id="${t.id}" value="${e?.wake||""}" aria-label="Wake time">
        <button class="mini" data-act="dsleep" data-id="${t.id}">Save</button>
        ${e?`<button class="icon-btn" data-act="dclear" data-id="${t.id}" aria-label="Clear">×</button>`:""}
      </div></div>`;
    }
    return `<div class="edit-line">${name}<div class="row-actions">
      <input class="num-input" type="number" step="0.25" placeholder="0" value="${e?e.value:""}" data-role="dval" data-id="${t.id}" aria-label="Value">
      <button class="mini" data-act="dval" data-id="${t.id}">Save</button>
      ${e?`<button class="icon-btn" data-act="dclear" data-id="${t.id}" aria-label="Clear">×</button>`:""}
    </div></div>`;
  }).join("");

  const { score } = dayScore(d, calMetric);
  host.innerHTML = `<div class="day-detail">
    <h3>${prettyDate(d)}</h3>
    <div class="row-sub">${score > .12 ? `${Math.round(score*100)}% of your best day this month` : "Nothing logged"} · edit anything below to correct it</div>
    ${lines || `<p class="row-sub">No trackers to edit.</p>`}
  </div>`;
}

/* ===== 12. RENDER: UPDATES ===== */
function renderInsights(){
  const el = $("#panel-insights");
  const live = S.trackers.filter(t=>!t.archived);
  let body = "";
  if (!live.length){
    body = `<div class="empty"><p>Once you're tracking something, this is where the pace math lands.</p></div>`;
  } else {
    const cards = live.map(t=>({ t, i:insightFor(t) })).sort((a,b)=> b.i.gap - a.i.gap);
    const behind = cards.filter(c=>c.i.tone==="behind").length;
    body = digestHTML() +
      `<div class="group-label">${behind ? `${plural(behind,"tracker")} slipping, listed first` : "Everything on pace, most slack last"}</div>` +
      cards.map(({t,i})=>`<div class="insight ${i.tone}">
        <h4>${t.parentId ? esc(byId(t.parentId)?.name||"") + " · " : ""}${esc(t.name)}</h4>

      : `<div class="bubble ai">Ask me anything about your numbers — I can see every tracker, subsection and entry. Try "which savings subsection should I feed first?"</div>`}</div>

  } else {
    body += `<div class="chat"><div style="padding:18px">
      <h4 style="margin:0 0 5px;font-size:14.5px">Want to talk it through?</h4>
      <p class="row-sub" style="margin:0 0 12px">Everything above is calculated on your device and needs nothing. Add an Anthropic API key and you also get a chat that can see all of it and argue trade-offs with you.</p>

  }

}

function dataSnapshot(){
  return S.trackers.filter(t=>!t.archived).map(t=>{
    const st = stats(t), i = insightFor(t);
    const base = { name:t.name, type:t.type, partOf: t.parentId ? byId(t.parentId)?.name : null,
      subsections: childrenOf(t.id).map(k=>k.name), target:effTarget(t), status:i.tone, summary:i.lead+" — "+i.detail };
    if (t.type === "savings") Object.assign(base,{ saved:Math.round(st.saved), goal:st.goal, perWeek:Math.round(st.perWeek), deadline:t.deadline||null });
    if (t.type === "ledger")  Object.assign(base,{ avgMonthlyIn:Math.round(st.avgIn), avgMonthlyOut:Math.round(st.avgOut), netThisMonth:Math.round(st.thisNet) });
    if (["habit","count","hours","sleep"].includes(t.type)) Object.assign(base,{ last7:st.series.slice(-7).map(p=>+p.value.toFixed(2)), avg7:+st.avg7.toFixed(2) });
    return base;
  });
}

async function sendChat(){
  const input = $("#chat-input"), log = $("#chat-log");
  const text = input.value.trim(); if (!text) return;
  input.value = "";
  S.chat.push({ role:"user", text });
  log.insertAdjacentHTML("beforeend", `<div class="bubble me">${esc(text)}</div>`);
  const thinking = document.createElement("div");
  thinking.className = "bubble ai"; thinking.textContent = "Thinking…";
  log.appendChild(thinking); log.scrollTop = log.scrollHeight;
  const history = S.chat.slice(-10).map(m=>({ role: m.role==="user"?"user":"assistant", content:m.text }));
  const system = `You are the advisor inside a personal tracking app. The user's current data as JSON:

${JSON.stringify(dataSnapshot(), null, 1)}

Today is ${today()}. Answer using these numbers. Be concrete, cite the actual figures, and when goals compete give a clear recommendation and say what it costs. Under 120 words unless they ask for depth. Don't recite the dataset back at them.`;
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-api-key": S.settings.apiKey,
        "anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true"
      },
      body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:1000, system, messages:history })
    });
    if (!res.ok){
      const t = await res.text().catch(()=>"");
      throw new Error(res.status === 401 ? "That API key was rejected." : "API error " + res.status + " " + t.slice(0,120));
    }
    const data = await res.json();
    const reply = (data.content||[]).map(b=>b.type==="text"?b.text:"").filter(Boolean).join("\n") || "No answer came back.";
    thinking.textContent = reply;
    S.chat.push({ role:"assistant", text:reply }); persist();
  } catch(err){
    thinking.textContent = (err && err.message) ? err.message : "Couldn't reach the model. Check your connection — nothing else in the app is affected.";
  }
  log.scrollTop = log.scrollHeight;
}

/* ===== 13. TRACKER SHEET ===== */
let draftColor = COLORS[0];

function openSheet(existing, presetParentId){
  const parent = presetParentId ? byId(presetParentId) : (existing?.parentId ? byId(existing.parentId) : null);
  const t = existing || { type: parent ? parent.type : "habit", targetPeriod: parent ? parent.targetPeriod : "week", color: COLORS[(S.trackers.length)%COLORS.length], chart:"progress" };
  draftColor = t.color || COLORS[0];
  const lockType = !!parent;
  const typeOpts = Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${k===t.type?"selected":""}>${v.label.replace(/s$/,"")}</option>`).join("");
  const swatches = COLORS.map(c=>`<button class="swatch" style="background:${c}" data-color="${c}" aria-pressed="${c===draftColor}" aria-label="Colour"></button>`).join("");
  const title = existing ? "Edit tracker" : (parent ? `New subsection` : "New tracker");
  const sub = parent ? `Part of ${esc(parent.name)}. It rolls up into that total automatically.` : "";

  $("#sheet").innerHTML = `
    <h3>${title}</h3>${sub?`<p class="sheet-sub">${sub}</p>`:""}
    <div class="field"><label for="f-name">Name</label>
      <input id="f-name" value="${existing?esc(t.name):""}" placeholder="${parent?"Savings 1":"Emergency fund, Gym, Client hours…"}"></div>
    <div class="field"><label for="f-type">What kind of thing is it</label>
      <select id="f-type" ${lockType?"disabled":""}>${typeOpts}</select>
      <div class="hint" id="type-hint"></div></div>
    <div id="type-fields"></div>
    <div class="field"><label>Colour</label><div class="swatches" id="f-colors">${swatches}</div></div>
    ${existing && !isGroup(existing) ? `<div class="field"><label>Recent entries</label><div class="hist-wrap" id="f-hist"></div></div>` : ""}
    <div class="sheet-actions">
      <div>${existing?`<button class="mini danger" id="f-delete">Delete tracker</button>`:""}</div>
      <div style="display:flex;gap:8px">
        <button class="mini secondary" id="f-cancel">Cancel</button>
        <button class="mini" id="f-save">${existing?"Save changes":"Create"}</button>
      </div>
    </div>`;

  const hints = {
    habit:"Tap a circle each day you do it. Target is days per week.",
    count:"A number you log daily — reps, pages, glasses of water.",
    hours:"Time logged per day, totalled against a daily or weekly target.",
    savings:"Deposits that stack toward a goal. Projects your finish date.",
    sleep:"Bed and wake time each night. Tracks hours and how steady the schedule is.",
    ledger:"Money in and out. Gives monthly net and average bills."
  };
  function typeFields(){
    const type = $("#f-type").value;
    $("#type-hint").textContent = hints[type];
    let f = "";
    if (type === "habit") f = `<div class="field"><label for="f-target">Days per week you're aiming for</label><input id="f-target" type="number" min="1" max="7" value="${t.target||4}"></div>`;
    else if (type === "savings") f = `<div class="field-pair">
        <div class="field"><label for="f-goal">Goal amount${parent?" for this subsection":""}</label><input id="f-goal" type="number" value="${t.goalAmount||""}" placeholder="5000"></div>
        <div class="field"><label for="f-deadline">Target date (optional)</label><input id="f-deadline" type="date" value="${t.deadline||""}"></div></div>
        ${parent?"":`<div class="hint">Leave blank on a parent goal and it adds up its subsections instead.</div>`}`;
    else if (type === "sleep") f = `<div class="field"><label for="f-target">Hours you want per night</label><input id="f-target" type="number" step="0.5" value="${t.target||8}"></div>`;
    else if (type === "ledger") f = `<div class="hint">Log amounts with the In and Out buttons on the Trackers tab.</div>`;
    else f = `<div class="field-pair">
        <div class="field"><label for="f-target">Target</label><input id="f-target" type="number" step="0.5" value="${t.target||""}" placeholder="40"></div>
        <div class="field"><label for="f-period">Per</label><select id="f-period"><option value="day" ${t.targetPeriod==="day"?"selected":""}>Day</option><option value="week" ${t.targetPeriod==="week"?"selected":""}>Week</option></select></div></div>
        <div class="field"><label for="f-unit">Unit label</label><input id="f-unit" value="${t.unit||TYPES[type].unitDefault}" placeholder="h"></div>`;
    $("#type-fields").innerHTML = f;
  }
  typeFields();
  $("#f-type").addEventListener("change", typeFields);

  if (existing && !isGroup(existing)) renderHistory(existing);

  $("#f-colors").addEventListener("click", e=>{
    const b = e.target.closest(".swatch"); if (!b) return;
    draftColor = b.dataset.color;
    $("#f-colors").querySelectorAll(".swatch").forEach(s=>s.setAttribute("aria-pressed", s.dataset.color===draftColor));
  });
  $("#f-cancel").addEventListener("click", closeSheet);
  $("#f-delete")?.addEventListener("click", ()=>{
    const kids = childrenOf(t.id).length;
    const msg = kids ? `Delete "${t.name}" and its ${plural(kids,"subsection")}, along with every entry? This can't be undone.`
                     : `Delete "${t.name}" and all its entries? This can't be undone.`;
    if (!confirm(msg)) return;
    deleteTracker(t.id); closeSheet(); renderAll(); toast("Tracker deleted");
  });
  $("#f-save").addEventListener("click", ()=>{
    const name = $("#f-name").value.trim();
    if (!name){ $("#f-name").focus(); toast("Give it a name first"); return; }
    const type = lockType ? parent.type : $("#f-type").value;
    const rec = existing || { id:uid(), createdAt:today() };
    rec.name = name; rec.type = type; rec.color = draftColor;
    rec.parentId = existing ? (existing.parentId||null) : (presetParentId||null);
    rec.target = +($("#f-target")?.value) || null;
    rec.targetPeriod = $("#f-period")?.value || TYPES[type].periodDefault;
    rec.unit = $("#f-unit")?.value ?? TYPES[type].unitDefault;
    rec.goalAmount = +($("#f-goal")?.value) || null;
    rec.deadline = $("#f-deadline")?.value || null;
    if (!TYPES[type].charts.includes(rec.chart)) rec.chart = TYPES[type].charts[0];
    if (!existing) S.trackers.push(rec);
    persist(); closeSheet(); renderAll();
    toast(existing ? "Changes saved" : (presetParentId ? "Subsection added" : "Tracker created"));
  });

  $("#scrim").classList.add("is-open");
  setTimeout(()=>$("#f-name").focus(), 60);
}

function renderHistory(t){
  const host = $("#f-hist"); if (!host) return;
  const es = S.entries.filter(e=>e.trackerId===t.id).sort((a,b)=> a.date<b.date?1:-1).slice(0,40);
  if (!es.length){ host.innerHTML = `<p class="hint">No entries yet.</p>`; return; }
  host.innerHTML = es.map(e=>{
    const val = t.type === "habit" ? "Done"
      : t.type === "sleep" ? `${e.value.toFixed(1)}h${e.bed?` (${e.bed}–${e.wake})`:""}`
      : MONEY_TYPES.includes(t.type) ? `${e.kind==="out"?"−":""}${money(e.value)}`
      : `${e.value}${t.unit||""}`;
    const editable = !["habit"].includes(t.type);
    return `<div class="hist-line">
      <span>${shortDate(e.date)}</span>
      ${editable ? `<input class="num-input" style="width:100%" type="number" step="0.25" value="${e.value}" data-role="hval" data-eid="${e.id}" aria-label="Value on ${e.date}">` : `<span>${val}</span>`}
      <button class="icon-btn" data-act="hist-del" data-eid="${e.id}" data-tid="${t.id}" aria-label="Delete entry">×</button>
    </div>`;
  }).join("");
}
function closeSheet(){ $("#scrim").classList.remove("is-open"); }

/* --- derived data, recomputed once per sync --- */
let AC = null;
function leafTrackers(){ return S.trackers.filter(t=>!t.archived && !isGroup(t)); }
function trackerBirth(t){
  if (t.createdAt) return t.createdAt;
  const es = S.entries.filter(e=>e.trackerId===t.id);
  return es.length ? es.map(e=>e.date).sort()[0] : today();
}
function longestRun(dates){
  const u = [...new Set(dates)].sort();
  let best = 0, run = 0, prev = null;
  u.forEach(d=>{ run = (prev && daysBetween(prev,d)===1) ? run+1 : 1; prev = d; best = Math.max(best,run); });
  return best;
}
function longestWeekRun(weeks){
  const u = [...new Set(weeks)].sort();
  let best = 0, run = 0, prev = null;
  u.forEach(w=>{ run = (prev && daysBetween(prev,w)===7) ? run+1 : 1; prev = w; best = Math.max(best,run); });
  return best;
}

function buildAC(){
  const leaves = leafTrackers();
  const dates = [...new Set(S.entries.map(e=>e.date))].sort();
  const first = dates[0] || today();
  const span = Math.min(400, daysBetween(first, today()) + 1);

  /* A day scores on trailing seven-day pace, not that day's raw total, so a
     four-times-a-week habit still reads as on track on a rest day. Each tracker
     is measured against its own weekly expectation, then averaged — which is
     what makes a two-tracker day comparable to a five-tracker one. */
  const spanDates = [];
  for (let i=0;i<span;i++) spanDates.push(addDays(today(), -(span-1-i)));
  const idx = new Map(spanDates.map((d,i)=>[d,i]));

  const daily = new Map();
  leaves.forEach(t => daily.set(t.id, new Float64Array(span)));
  S.entries.forEach(e=>{
    const arr = daily.get(e.trackerId); if (!arr) return;
    const i = idx.get(e.date); if (i === undefined) return;
    const t = byId(e.trackerId);
    arr[i] += t.type === "ledger" ? 1 : (e.value || 0);   // ledger counts movements, not dollars
  });
  const prefix = new Map();
  daily.forEach((arr,id)=>{
    const pf = new Float64Array(span+1);
    for (let i=0;i<span;i++) pf[i+1] = pf[i] + arr[i];
    prefix.set(id, pf);
  });
  const windowSum = (id,i) => { const pf = prefix.get(id); return pf[i+1] - pf[Math.max(0,i-6)]; };

  const weeklyExp = new Map();
  leaves.forEach(t=>{
    const tg = effTarget(t);
    if (t.type === "habit")  weeklyExp.set(t.id, tg || 7);
    else if (t.type === "sleep") weeklyExp.set(t.id, (tg || 8) * 6.5);
    else if (t.type === "count" || t.type === "hours")
      weeklyExp.set(t.id, tg ? (t.targetPeriod === "week" ? tg : tg*7) : null);
    else if (t.type === "savings"){
      const es = S.entries.filter(e=>e.trackerId===t.id);
      const tot = es.reduce((a,e)=>a+e.value,0);
      const wks = Math.max(1, daysBetween(trackerBirth(t), today())/7);
      weeklyExp.set(t.id, tot > 0 ? tot/wks : null);
    } else weeklyExp.set(t.id, 1);
  });

  const scores = new Map();
  spanDates.forEach((d,i)=>{
    const pool = leaves.filter(t => trackerBirth(t) <= d);
    if (!pool.length){ scores.set(d,0); return; }
    let sum = 0;
    pool.forEach(t=>{
      const w = windowSum(t.id, i);
      const exp = weeklyExp.get(t.id);
      sum += exp ? Math.min(1, w/exp) : (w > 0 ? 1 : 0);
    });
    scores.set(d, sum/pool.length);
  });
  const scored = [...scores.entries()];

  const bestWindow = n => {
    if (scored.length < n) return 0;
    let best = 0;
    for (let i=0;i<=scored.length-n;i++){
      let s = 0; for (let j=0;j<n;j++) s += scored[i+j][1];
      best = Math.max(best, s/n);
    }
    return best;
  };

  const monthScore = {}, monthActive = {};
  scored.forEach(([d,v])=>{
    const k = monthKey(d);
    (monthScore[k] = monthScore[k] || []).push(v);
    if (v > 0) monthActive[k] = (monthActive[k]||0) + 1;
  });
  const monthAvgs = Object.entries(monthScore).map(([k,a])=>[k, a.reduce((x,y)=>x+y,0)/a.length]);

  const byType = ty => leaves.filter(t=>t.type===ty);
  const entsOf = ty => S.entries.filter(e=>{ const t = byId(e.trackerId); return t && t.type===ty; });

  const savingsEnts = entsOf("savings");
  const sleepEnts = entsOf("sleep").filter(e=>e.value>0);
  const ledgerEnts = entsOf("ledger");

  const goalsDone = byType("savings").filter(t=>{
    const g = effGoal(t); if (!g) return false;
    return stats(t).saved >= g;
  }).length;

  const hoursWeeksHit = [];
  byType("hours").forEach(t=>{
    const tg = effTarget(t); if (!tg || t.targetPeriod !== "week") return;
    const buckets = {};
    S.entries.filter(e=>e.trackerId===t.id).forEach(e=>{ const w = weekStart(e.date); buckets[w] = (buckets[w]||0) + e.value; });
    Object.entries(buckets).forEach(([w,v])=>{ if (v >= tg) hoursWeeksHit.push(w); });
  });

  const ledgerMonths = {};
  ledgerEnts.forEach(e=>{ const k = monthKey(e.date); ledgerMonths[k] = ledgerMonths[k] || {in:0,out:0}; ledgerMonths[k][e.kind==="out"?"out":"in"] += e.value; });
  const greenMonths = Object.values(ledgerMonths).filter(m=>m.in > m.out).length;

  let sleepSteady = false;
  const sortedSleep = sleepEnts.filter(e=>e.bed).sort((a,b)=>a.date<b.date?-1:1);
  for (let i=0;i+7<=sortedSleep.length;i++){
    const mins = sortedSleep.slice(i,i+7).map(e=>{ const [h,m]=e.bed.split(":").map(Number); return (h<12?h+24:h)*60+m; });
    const mean = mins.reduce((a,b)=>a+b,0)/7;
    const sd = Math.sqrt(mins.reduce((a,x)=>a+(x-mean)**2,0)/7);
    if (sd <= 30){ sleepSteady = true; break; }
  }
  const sleepOnTarget = sleepEnts.filter(e=>{ const t = byId(e.trackerId); return t && e.value >= (effTarget(t)||8); });

  let habitStreak = 0;
  byType("habit").forEach(t=>{
    habitStreak = Math.max(habitStreak, longestRun(S.entries.filter(e=>e.trackerId===t.id && e.value>0).map(e=>e.date)));
  });
  S.trackers.filter(t=>t.type==="habit" && isGroup(t)).forEach(t=>{
    const fam = familyIds(t.id);
    habitStreak = Math.max(habitStreak, longestRun(S.entries.filter(e=>fam.includes(e.trackerId) && e.value>0).map(e=>e.date)));
  });

  AC = {
    scored,
    entryCount: S.entries.length,
    trackerCount: S.trackers.filter(t=>!t.archived).length,
    subCount: S.trackers.filter(t=>t.parentId && !t.archived).length,
    maxSubs: Math.max(0, ...S.trackers.map(t=>childrenOf(t.id).length)),
    activeDays: dates.length,
    activeRun: longestRun(dates),
    typesUsed: new Set(leaves.filter(t=>S.entries.some(e=>e.trackerId===t.id)).map(t=>t.type)).size,
    typesOwned: new Set(S.trackers.filter(t=>!t.archived).map(t=>t.type)),
    habitStreak,
    perfect: scored.filter(([,v])=>v >= .9).length,
    strongDays: scored.filter(([,v])=>v >= .6).length,
    week80: bestWindow(7),
    month50: monthAvgs.filter(([,v])=>v >= .5).length,
    monthsSolid: Object.values(monthActive).filter(n=>n >= 15).length,
    ageDays: dates.length ? daysBetween(first, today()) + 1 : 0,
    saved: savingsEnts.reduce((a,e)=>a+e.value,0),
    goalsDone,
    depositWeekRun: longestWeekRun(savingsEnts.map(e=>weekStart(e.date))),
    depositMonths: new Set(savingsEnts.map(e=>monthKey(e.date))).size,
    hours: entsOf("hours").reduce((a,e)=>a+e.value,0),
    hoursWeeks: [...new Set(hoursWeeksHit)],
    hoursWeekRun: longestWeekRun(hoursWeeksHit),
    countEnts: entsOf("count").length,
    sleepNights: sleepEnts.length,
    sleepOnTarget: sleepOnTarget.length,
    sleepSteady,
    ledgerCount: ledgerEnts.length,
    greenMonths
  };
  return AC;
}

function evaluate(){
  buildAC();
  return ACHIEVEMENTS.map(a=>{
    const [cur, goal] = a.p();
    return { ...a, cur:Math.max(0,cur), goal, earned: cur >= goal };
  });
}

function syncAchievements(){
  const list = evaluate();
  const now = list.filter(a=>a.earned).map(a=>a.id);
  if (S.unlocked === null || S.unlocked === undefined){ S.unlocked = now; persist(); return; }
  const fresh = now.filter(id=>!S.unlocked.includes(id));
  if (fresh.length){
    S.unlocked = now; persist();
    queueUnlock(fresh.map(id=>list.find(a=>a.id===id)).filter(Boolean));
  } else if (now.length !== S.unlocked.length){ S.unlocked = now; persist(); }
}

/* ===== 17. WEEKLY DIGEST (rules only, no network) ===== */
function mean(a){ return a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0; }
function weeklyDigest(){
  buildAC();
  const sc = AC.scored || [];
  const now = mean(sc.slice(-7).map(x=>x[1]));
  const prev = mean(sc.slice(-14,-7).map(x=>x[1]));
  const lines = [];
  const live = S.trackers.filter(t=>!t.archived);
  const cards = live.map(t=>({ t, i:insightFor(t) }));

  const worst = cards.filter(c=>c.i.tone !== "good").sort((a,b)=>b.i.gap - a.i.gap)[0];
  if (worst) lines.push({ cls:"act", html:`<b>${esc(worst.t.name)}</b> needs attention first — ${worst.i.detail}` });

  live.filter(t=>t.type==="savings" && !isGroup(t)).forEach(t=>{
    const es = S.entries.filter(e=>e.trackerId===t.id).map(e=>e.date).sort();
    if (!es.length) return;
    const gap = daysBetween(es[es.length-1], today());
    if (gap >= 14) lines.push({ cls:"act", html:`<b>${esc(t.name)}</b> hasn't been fed in ${plural(gap,"day")}. Even a small deposit restarts the rate.` });
  });

  const named = new Set(worst ? [worst.t.id] : []);
  const maxed = cards.filter(c=>c.i.tone === "good" && c.i.gap === 0);
  const starved = cards.filter(c=>c.i.gap > .5);
  if (maxed.length && starved.length){
    lines.push({ html:`<b>${esc(maxed[0].t.name)}</b> is comfortably ahead while <b>${esc(starved[0].t.name)}</b> is well behind. Shifting effort costs you little on the first and a lot on the second.` });
    named.add(maxed[0].t.id); named.add(starved[0].t.id);
  }

  const best = cards.filter(c=>c.i.tone === "good" && !named.has(c.t.id)).sort((a,b)=>a.i.gap - b.i.gap)[0];
  if (best) lines.push({ cls:"win", html:`<b>${esc(best.t.name)}</b> is holding — ${best.i.lead.toLowerCase()}.` });

  if (prev > 0){
    const d = now - prev;
    if (Math.abs(d) > .04)
      lines.push({ html: d > 0
        ? `Overall pace is up ${Math.round(d*100)} points on last week.`
        : `Overall pace is down ${Math.round(-d*100)} points on last week. Usually one tracker is doing that, not all of them.` });
  }
  return { now, prev, delta: now - prev, lines, spark: sc.slice(-14).map(x=>x[1]) };
}

function digestHTML(){
  if (!S.trackers.filter(t=>!t.archived).length) return "";
  const d = weeklyDigest();
  const dir = d.prev > 0 ? (d.delta >= 0 ? "up" : "down") : "";
  const arrow = d.prev > 0 ? (d.delta >= 0 ? "▲" : "▼") : "";
  const bars = d.spark.map(v=>`<i style="height:${Math.max(4, v*34).toFixed(0)}px;opacity:${(.4+v*.6).toFixed(2)}"></i>`).join("");
  return `<div class="digest">
    <div class="row-sub" style="margin:0 0 6px">Seven-day pace across everything you track</div>
    <div><span class="big">${Math.round(d.now*100)}%</span>${arrow?`<span class="delta ${dir}">${arrow} ${Math.abs(Math.round(d.delta*100))}</span>`:""}</div>
    <div class="spark-row">${bars}</div>
    <ul>${d.lines.map(l=>`<li class="${l.cls||""}">${l.html}</li>`).join("")}</ul>
  </div>`;
}
